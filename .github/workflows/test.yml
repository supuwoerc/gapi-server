name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 保持与 deploy/docker/docker-compose.yaml 中的 tag 一致
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: gapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      # 003 的两条 INSERT ... SELECT 依赖 sys_role 中已有 admin/user 角色,
      # 角色缺失时不报错只静默插入 0 行, 所以拆成三步: 建表 → 补角色 → 灌权限
      - name: Apply schema migrations
        env:
          PGPASSWORD: password
        run: |
          psql -h 127.0.0.1 -U postgres -d gapi -v ON_ERROR_STOP=1 \
            -f migrations/001_create_cron_tables.sql
          psql -h 127.0.0.1 -U postgres -d gapi -v ON_ERROR_STOP=1 \
            -f migrations/002_create_user_permission_tables.sql

      - name: Seed base roles
        env:
          PGPASSWORD: password
        run: |
          psql -h 127.0.0.1 -U postgres -d gapi -v ON_ERROR_STOP=1 -c \
            "INSERT INTO sys_role (name, code, sort_order) VALUES ('管理员','admin',0), ('普通用户','user',1);"

      - name: Seed frontend permissions
        env:
          PGPASSWORD: password
        run: |
          psql -h 127.0.0.1 -U postgres -d gapi -v ON_ERROR_STOP=1 \
            -f migrations/003_seed_frontend_permissions.sql

      - name: Run integration tests
        run: go test ./internal/dal/ -tags=integration -v

      - name: Build
        run: go build ./...
