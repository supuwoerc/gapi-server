services:
  postgres:
    image: postgres:18-alpine
    container_name: gapi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: gapi
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      # PG 18+ 的 PGDATA 为 /var/lib/postgresql/18/docker, 镜像声明的卷是
      # /var/lib/postgresql. 挂到 .../data 会被识别为 "unused mount" 并直接报错,
      # 挂在上层目录才能让 pg_upgrade --link 不跨挂载点边界.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gapi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: gapi-etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: gapi-etcd
      # 必须显式指定, 否则 etcd 默认写入 /default.etcd, 下方挂载卷不生效
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: gapi-etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: gapi-etcd-token
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd_data:/etcd-data

  # etcd 的可视化管理界面, 仅本地开发使用。
  # 带 profiles 的 service 默认不启动, 需显式启用:
  #   docker compose -f deploy/docker/docker-compose.yaml --profile tools up -d
  # 不加 --profile 时 up/down 都不会碰它, 因此不会被带进任何非开发环境。
  etcd-workbench:
    image: tzfun/etcd-workbench:latest
    container_name: gapi-etcd-workbench
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      # 端口未经验证(拉取镜像时 docker hub 不可达), 若打不开先查
      # docker logs gapi-etcd-workbench 里实际监听的端口再改这里
      - "8002:8002"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - etcd

volumes:
  postgres_data:
  redis_data:
  etcd_data:
